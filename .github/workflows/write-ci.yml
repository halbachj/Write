name: Write CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  merge_group:
  workflow_dispatch:

# PR code gets read-only credentials. Publishing/signing/release workflows must
# remain separate and must never run untrusted pull-request code.
permissions:
  contents: read

concurrency:
  group: write-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NIX_CONFIG: "accept-flake-config = true"

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout triggering revision and recorded submodules
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@90bb610b90bf290cad97484ba341453bd1cbefea # v19

      - name: Record tested revision
        run: |
          git rev-parse HEAD | tee tested-revision.txt
          git submodule status --recursive | tee tested-submodules.txt
          nix --version | tee toolchain.txt

      - name: Formatting, Nix, workflow, shell, and full-tree checks
        run: nix develop -c ./scripts/check quick

      - name: Scan introduced commit range for secrets
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [[ "${{ github.event.before }}" != "" && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            range="${{ github.event.before }}..${{ github.sha }}"
          else
            range="${{ github.sha }}"
          fi
          echo "Scanning commit range: $range"
          nix develop -c gitleaks git --redact --log-opts="$range" .

      - name: Upload quality evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quality-evidence
          path: |
            tested-revision.txt
            tested-submodules.txt
            toolchain.txt
          if-no-files-found: warn

  linux-regression:
    name: linux-regression
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout triggering revision and recorded submodules
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@90bb610b90bf290cad97484ba341453bd1cbefea # v19

      - name: Build sanitized debug binary
        run: nix develop .#linux -c make -C syncscribble DEBUG=1 USE_SYSTEM_SDL=1 -j"$(nproc)"

      - name: Run headless regression and document-integrity suite
        run: nix develop .#linux -c ./scripts/run-tests.sh --out "$RUNNER_TEMP/write-test-output"

      - name: Upload regression evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-regression-evidence
          path: ${{ runner.temp }}/write-test-output
          if-no-files-found: warn

  linux-smoke:
    name: linux-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout triggering revision and recorded submodules
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@90bb610b90bf290cad97484ba341453bd1cbefea # v19

      - name: Build debug application
        run: nix develop .#linux -c make -C syncscribble DEBUG=1 USE_SYSTEM_SDL=1 -j"$(nproc)"

      - name: Start, open bundled SVG, and exit headlessly
        run: nix develop .#linux -c ./scripts/smoke-linux.sh

  static-analysis:
    name: static-analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout triggering revision and recorded submodules
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@90bb610b90bf290cad97484ba341453bd1cbefea # v19

      - name: Curated clang-tidy with a real compile database
        run: nix develop -c ./scripts/check static

  android-build-lint:
    name: android-build-lint
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout triggering revision and recorded submodules
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@90bb610b90bf290cad97484ba341453bd1cbefea # v19

      - name: Assemble and lint Android debug variant
        run: nix develop .#android -c env WRITE_ANDROID_ARTIFACT_DIR="$RUNNER_TEMP/android-output" ./scripts/check android

      - name: Upload Android reports and APK
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-build-lint-evidence
          path: ${{ runner.temp }}/android-output
          if-no-files-found: warn

  ci-gate:
    name: ci-gate
    runs-on: ubuntu-24.04
    needs:
      [
        quality,
        linux-regression,
        linux-smoke,
        static-analysis,
        android-build-lint,
      ]
    # always() is essential: a failed, cancelled, missing, or skipped required
    # dependency reaches this job and is explicitly rejected below.
    if: ${{ always() }}
    timeout-minutes: 5
    steps:
      - name: Require every validation job to succeed
        shell: bash
        run: |
          set -euo pipefail
          results=(
            "quality=${{ needs.quality.result }}"
            "linux-regression=${{ needs.linux-regression.result }}"
            "linux-smoke=${{ needs.linux-smoke.result }}"
            "static-analysis=${{ needs.static-analysis.result }}"
            "android-build-lint=${{ needs.android-build-lint.result }}"
          )
          printf '%s\n' "${results[@]}"
          for result in "${results[@]}"; do
            [[ "$result" == *=success ]] || {
              echo "Required validation did not succeed: $result" >&2
              exit 1
            }
          done
